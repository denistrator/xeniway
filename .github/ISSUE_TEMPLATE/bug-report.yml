name: Bug report
description: Report a reproducible problem in Xenia Way.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, session IDs, personal data, or vulnerability details. Use the private process in [SECURITY.md](https://github.com/denistrator/xeniway/blob/main/SECURITY.md) for security issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable set of steps to reproduce the issue.
      placeholder: |
        1. Start with ...
        2. Navigate to ...
        3. Select ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, Bun version, and whether this is local development.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Identify the affected workflow, API area, data boundary, or accessibility behavior.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain any suspected security or privacy impact. Report an actual vulnerability privately through SECURITY.md instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact credentials, tokens, personal data, and other sensitive information before posting.
  - type: checkboxes
    id: checklist
    attributes:
      label: Scope and safety
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability or private-data disclosure.
          required: true
        - label: I have removed secrets, session IDs, and personal data.
          required: true
