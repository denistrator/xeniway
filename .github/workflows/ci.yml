name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://job_tracker:job_tracker@localhost:5432/job_tracker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_tracker
          POSTGRES_USER: job_tracker
          POSTGRES_PASSWORD: job_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_tracker -d job_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
