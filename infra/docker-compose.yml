name: job-tracker

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: job_tracker
      POSTGRES_PASSWORD: job_tracker
    ports:
      - "5432:5432"
    volumes:
      - job_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_tracker -d job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  job_tracker_postgres_data:
