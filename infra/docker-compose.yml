name: xeniway

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: xeniway
      POSTGRES_USER: xeniway
      POSTGRES_PASSWORD: xeniway
    ports:
      - "5432:5432"
    volumes:
      - xeniway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeniway -d xeniway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - xeniway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  xeniway_postgres_data:
  xeniway_redis_data:
