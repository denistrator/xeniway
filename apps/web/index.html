<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (() => {
        const storedTheme = localStorage.getItem("xeniway-theme");
        const preference = ["light", "dark", "system"].includes(storedTheme ?? "") ? storedTheme : "system";
        const isDark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        // Keep #020618 synchronized with the dark --color-canvas token in apps/web/src/index.css.
        document.documentElement.style.backgroundColor = isDark ? "#020618" : "#f5f3ee";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", isDark ? "#020618" : "#f5f3ee");
      })();
    </script>
    <title>Xenia Way</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
